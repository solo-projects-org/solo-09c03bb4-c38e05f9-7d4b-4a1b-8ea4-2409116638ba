<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}道路巡检桥接上报复核{% endblock %}</title>
<style>
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 2rem auto; max-width: 960px; padding: 0 1rem; color: #222; }
  h1 a { color: inherit; text-decoration: none; }
  table { border-collapse: collapse; margin: 0.8rem 0 1.5rem; }
  th, td { border: 1px solid #ccc; padding: 0.35rem 0.7rem; font-size: 0.92rem; }
  th { background: #f0f0f0; }
  .ok  { background: #e6f4ea; border: 1px solid #34a853; padding: 0.5rem 0.8rem; border-radius: 4px; }
  .err { background: #fce8e6; border: 1px solid #d93025; padding: 0.5rem 0.8rem;
         border-radius: 4px; white-space: pre-wrap; }
  .withdrawn td { color: #999; }
  .withdrawn td:first-child { text-decoration: line-through; }
  .bridge { border: 1px solid #f9ab00; background: #fef7e0; border-radius: 6px;
            padding: 0.6rem 1rem; margin: 0.6rem 0; }
  code { background: #f5f5f5; padding: 0 0.3rem; border-radius: 3px; }
</style>
</head>
<body>
<h1><a href="/">道路巡检桥接上报复核</a></h1>
{% block content %}{% endblock %}
</body>
</html>
